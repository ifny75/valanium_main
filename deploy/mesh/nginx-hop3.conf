map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Что попадает в журнал доступа.
#
# Формат по умолчанию пишет User-Agent, а он у мессенджера — не «браузер»,
# а точная модель телефона и сборка ОС: строки вида
# "Dalvik/2.1.0 (Linux; U; Android 17; Pixel 8 Pro Build/CP2A.260805.005)"
# вместе со временем каждого запуска приложения лежали здесь две недели.
# Ни адреса, ни User-Agent, ни referer тут больше нет: для дела хватает
# времени, кода ответа и пути, а всё остальное — досье на человека, которое
# мы завели бы себе сами.
# Вход определяется портом, на котором принят запрос, и ничем больше:
# 8082 — Tor, остальное — Cloudflare. Подробнее в valanium-proxy.conf.
# Ослепление адреса: наружу из этого узла едет жетон, а не IP.
# Подробности и цена решения — в valanium-blind.js.
js_import valanium from /etc/nginx/valanium-blind.js;
js_set $valanium_blinded valanium.blindClient;

# Откуда берётся жетон, зависит от входа:
#   8080 — пришло от Cloudflare, ослепляем здесь;
#   8082 — Tor, адреса не существует вовсе.
map $server_port $valanium_client {
    8082    "onion";
    default $valanium_blinded;
}

map $server_port $valanium_route {
    8082    onion;
    default cloudflare;
}


# Публичная точка входа cloudflared и Tor onion service.
server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8082;
    server_name _;
    access_log /var/log/nginx/access.log valanium;
    client_max_body_size 17m;

    location ^~ /multihop/ {
        # Второй этап Multi-hop выключен. Не выдаём один переход за два.
        return 503;
    }
    location = /ws {
        # Сессию сокета не журналируем: длительность и объём — сведения о человеке.
        access_log off;
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
    location / {
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
}
