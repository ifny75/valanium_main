<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - ObsyxGen VPN</title>
    <!-- Bootstrap 5 CSS (vendored locally, see main_server/scripts/vendor_assets.py) -->
    <link href="/static/vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/css/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1d29;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #2c3040;
            color: #fff;
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            padding: 30px;
        }
        .login-card .form-control {
            background-color: #1a1d29;
            border: 1px solid #3b4054;
            color: #fff;
        }
        .login-card .form-control:focus {
            background-color: #1a1d29;
            color: #fff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .logo-icon {
            font-size: 3rem;
            color: #0d6efd;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <i class="bi bi-shield-lock-fill logo-icon"></i>
        <h3 class="mb-4">ObsyxGen VPN</h3>
        
        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_prefix }}/login" method="POST">
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-4 text-start">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
    </div>
</body>
</html>
