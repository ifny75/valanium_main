[package]
name = "valanium-vpn"
version = "0.1.0"
description = "Valanium VPN desktop client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
libloading = "0.8"
base64 = "0.22"
# Подпись устройства и ключи WireGuard рождаются на клиенте (identity.rs,
# wg_keys.rs) — до этого их генерировал сервер и присылал вместе с приватной
# половиной.
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pki-types = "1"

# DPAPI для ключа устройства: расшифровать файл может только эта учётная
# запись Windows на этой машине.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[[bin]]
name = "valanium-vpn"
path = "src/main.rs"
